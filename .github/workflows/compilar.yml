{
"name": "Construir APK",
"on": ["push", "workflow_dispatch"],
"jobs": {"build": {"runs-on": "ubuntu-latest", "timeout-minutes": 45, "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Descomprimir proyecto", "run": "for z in *.zip; do [ -f \"$z\" ] && unzip -o -q \"$z\" && echo \"Descomprimido: $z\"; done; ls"},
{"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "21"}},
{"name": "Aceptar licencias", "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true"},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "9.3.1"}},
{"name": "Preparar archivos", "run": "touch .env.example; if [ ! -f debug.keystore ]; then keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname \"CN=Android Debug,O=Android,C=US\"; fi"},
{"name": "Compilar APK", "run": "gradle :app:assembleDebug --stacktrace"},
{"name": "Subir APK", "uses": "actions/upload-artifact@v4", "with": {"name": "aura-atelier-apk", "path": "app/build/outputs/apk/debug/*.apk"}}
]}}
}
